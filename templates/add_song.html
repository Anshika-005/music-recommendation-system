<!DOCTYPE html>
<html>

<head>
    <title>Add Song</title>
</head>

<body>

    <h1>Add Song</h1>

    <form method="POST">

        <input
            type="text"
            name="song_name"
            placeholder="Song Name"
            required
        >

        <br><br>

        <input
            type="text"
            name="artist"
            placeholder="Artist"
            required
        >

        <br><br>

        <input
            type="text"
            name="genre"
            placeholder="Genre"
            required
        >

        <br><br>

        <button type="submit">
            Add Song
        </button>

    </form>

</body>

</html>
